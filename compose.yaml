name: jungle-wagering

x-app: &app
  build: .
  environment: &environment
    DATABASE_URL: postgres://wager:wager@postgres:5432/wager
    SQS_ENDPOINT: http://localstack:4566
    AWS_REGION: us-east-1
    AWS_ACCESS_KEY_ID: test
    AWS_SECRET_ACCESS_KEY: test
    WORKERS_ENABLED: 'true'
  depends_on:
    setup:
      condition: service_completed_successfully
  stop_grace_period: 90s
  healthcheck:
    test: ['CMD', 'bun', '-e', "fetch('http://localhost:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 10s
    timeout: 8s
    retries: 10

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: wager
      POSTGRES_PASSWORD: wager
      POSTGRES_DB: wager
    ports: ['127.0.0.1:55432:5432']
    volumes: ['postgres-data:/var/lib/postgresql']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wager -d wager']
      interval: 3s
      timeout: 3s
      retries: 20
  localstack:
    image: localstack/localstack:4.9.2
    environment:
      SERVICES: sqs
      SQS_ENDPOINT_STRATEGY: path
    ports: ['127.0.0.1:4566:4566']
    healthcheck:
      test: ['CMD', 'awslocal', 'sqs', 'list-queues']
      interval: 5s
      timeout: 5s
      retries: 30
  setup:
    build: .
    environment: *environment
    command: ['sh', '-c', 'bun run migrate && bun run queues']
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
  app-1:
    <<: *app
    ports: ['127.0.0.1:3000:3000']
  app-2:
    <<: *app
    ports: ['127.0.0.1:3001:3000']
  app-3:
    <<: *app
    ports: ['127.0.0.1:3002:3000']
  tests:
    build: .
    profiles: ['test']
    environment:
      <<: *environment
      NODE_ENV: test
      LOG_LEVEL: silent
      REFERENCE_BACKOFF_MS: 10
      REFERENCE_MAX_ATTEMPTS: 3
      OUTBOX_BACKOFF_MS: 10
      SQS_VISIBILITY_SECONDS: 3
      TEST_SQS: 'true'
    command: ['sh', '-c', 'bun run typecheck && bun test --timeout 60000 && bun run build']
    depends_on:
      setup:
        condition: service_completed_successfully

volumes:
  postgres-data:
